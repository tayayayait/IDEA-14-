                            - paragraph [ref=f1e279]: "필요서류: 1. 정식 신청서 (正式申请书) 2. 제품 기술 파라미터표 (产品技术参数表) 3. 트레드(패턴) 목록 (花纹清单) 4. 견인형 타이어, 오프로드 타이어, 특수 용도 타이어, 런플랫 타이어의 경우 해당 증빙 자료 (牵引型轮胎、专用越野轮胎、特殊用途轮胎、自体支撑型缺气保用轮胎需要提供相应的证明材料) 5. 공장 검사 조사표 (工厂检查调查表) 6. 생산&middot;검사 과정 관련 계약서(필요 시) (生产过程、检验过程分包协议（需要时）) 7. 인증 의뢰인, 생산자(제조자) 및 생산기업 등록 증빙 자료 (认证委托人、生产者（制造者）和生产企业的注册证明材料) 8. 인증 제품이 GB518, GB9743, GB9744 표준의 제품 안전 성능을 충족함을 입증하는 시험 성적서(필요 시) (认证产品满足 GB518，GB9743，GB9744 标准的产品安全性能的检测报告（需要时）) 9. 튜브 생산자(제조사) 또는 생산기업 목록 및 품질 증빙 서류 (内胎生产者（制造商）或生产企业清单及质量证明文件) &bull; 품질 증빙 서류는 GB/T 7036.1 및 GB/T 7036.2 요구 사항을 충족하는 유효 문서 (质量证明文件为符合 GB/T 7036.1 和 GB/T 7036.2 要求的有效文件) &bull; 비고 : 타이어 제품의 핵심 부품은 튜브이며, 튜브가 없는 타이어는 제외 （注：轮胎产品关键零部件为内胎，无内胎轮胎除外） 10. 생산 일관성 관리 계획 (生产一致性控制计划) 11. 기타 자료(예 : 품질경영시스템 인증서, 상표 소유 증명서 등) (其他资料（如：质量管理体系认证证明文件、所属商标的证明文件等）) 12. 인증 의뢰인&middot;생산자&middot;생산기업 간의 관련 계약서 또는 합의서, 위임장 및 원본 인증서 사본(필요 시) (认证委托人、生产者、生产企业之间签订的有关协议书或合同，授权书及原始证书复印件（需要时）) 13. 변경 신청의 경우, 해당 변경 항목의 증빙 자료 (对于变更申请，相关变更项目的证明文件)"
