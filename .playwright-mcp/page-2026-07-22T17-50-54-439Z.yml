            - generic [ref=e615]:
              - paragraph [ref=e616]: 수입금지품목
              - list [ref=e617]:
                - listitem [ref=e618]: "미국의 수입규제 제도는 자국 산업 보호, 소비자 안전, 국민 건강, 동식물 및 환경 보호, 국가안보 및 외교정책 목적 등을 위해 운영되며, 크게 수입금지 품목(Prohibited Items)과 수입규제 품목(Restricted Items)으로 구분된다. 수입금지 품목은 법령상 원칙적으로 미국 반입이 허용되지 않는 품목을 의미하며, 수입규제 품목은 허가·검역·인증·표시·쿼터·제재 예외 승인 등 일정 요건 충족 시에만 반입이 가능한 품목을 의미한다. 미국의 수입규제는 관세국경보호청(CBP)이 통관 집행을 총괄하되, 품목별로 소비자제품안전위원회(CPSC), 식품의약청(FDA), 농무부 동식물검역청(USDA APHIS), 어류·야생동물관리국(USFWS), 질병통제예방센터(CDC), 재무부 외국자산통제국(OFAC) 등 다수의 관계 연방기관 규정이 병행 적용된다. 이에 따라 수입자는 통관 단계에서 관세분류, 원산지, 수입자 정보, 제품안전 인증, 식품·의약품 사전통보, 동식물 검역, 제재대상 여부 등 품목별 요건을 모두 충족해야 한다. 특히 2008년 「소비자제품안전개선법(CPSIA)」과 2011년 「식품안전현대화법(FSMA)」 시행 이후 소비자제품 및 식품 수입에 대한 사전 예방형 관리가 강화되어 왔다. 여기에 최근 보호무역주의 및 경제안보 기조가 확대되면서, 반덤핑·상계관세(AD/CVD), 긴급수입제한조치(세이프가드), 무역확장법 232조, 무역법 301조, 강제노동 금지, 경제제재, 지식재산권 보호 조치 등 통상·안보 목적의 규제도 복합적으로 적용되고 있다. 수입금지 및 고위험 제한 품목 다음 품목은 미국 법령에 따라 원칙적으로 반입이 금지되거나, 관계기관의 허가·승인·검역 요건을 충족하지 못할 경우 반입이 제한된다. 1) 소비자 및 공공안전 위험 품목 - 미국 안전기준을 충족하지 못한 차량, 위험한 장난감, 결함 또는 위해 가능성이 있는 소비자제품 등 공공 안전에 위해를 초래할 수 있는 물품 - 특정 성분 기준을 충족하지 못한 앱상트(Absinthe) 등 주류, 미승인 의약품 및 불법 약물(Rohypnol 등) 2) 위조 및 지식재산권 침해 품목 - 위조 화폐, 위조 증권, 위조 제조 장비 등 금융질서 침해 물품 - 위조 상표가 부착된 제품, 저작권 침해 물품, 불법 복제 제품 등 지식재산권 침해 물품 3) 강제노동 생산품 - 미국 관세법 제307조에 따라 강제노동으로 전체 또는 부분적으로 채굴, 생산 및 제조된 물품은 미국 반입이 금지됨. - CBP는 Withhold Release Order(WRO), Finding, 위구르강제노동방지법(UFLPA) 등을 근거로 강제노동 의심 물품의 통관 보류, 반입 거부, 압류 등을 집행할 수 있음. * 2025년 4월 한 달간 CBP는 약 3,650만 달러 상당의 강제노동 의심 화물을 조사 또는 차단함. 4) 동식물 보호 및 생물검역 관련 품목 - CITES 협약 및 미국 멸종위기종법(ESA) 적용 대상 동식물, 야생동물 부산물, 상아·거북등껍질·희귀동물 가죽 등 보호종 유래 제품 - 부시미트(Bushmeat), 특정 동물성 식품, 검역 기준을 충족하지 못한 육류·유제품·계란류 등 질병 전파 위험이 있는 식품 - 병해충 유입 가능성이 있는 토양, 식물, 종자, 생과일·채소, 목재 및 식물성 제품 등 5) 기타 법령에 따른 수입 금지·제한 품목 - 무기류, 탄약, 방위물자 등은 관계기관 허가가 필요한 제한 품목이며, ATF 등 관계기관 요건을 충족하지 못할 경우 반입이 제한됨. - 개·고양이 털로 제조된 제품, 불법 문화재, 고고학적 유물, 보호대상 야생동물 트로피 등 6) 경제제재 대상국 및 제재대상자 관련 수입품 - 외국자산통제국(OFAC) 규정에 따라 쿠바 및 북한 등 포괄적 제재 프로그램이 적용되는 국가 및 특정 제재대상자(SDN)와 관련된 물품·서비스·거래는 원칙적으로 금지 또는 제한될 수 있음. * 단, 예외적으로 미 재무부 승인을 받은 물품에 한해 수입 허용 가능 자료원: U.S. Customs and Border Protection(CBP), Consumer Product Safety Commission(CPSC), Food and Drug Administration(FDA), USDA APHIS, U.S. Fish and Wildlife Service, Centers for Disease Control and Prevention(CDC), Office of Foreign Assets Control(OFAC), USTR, Federal Register 등"
